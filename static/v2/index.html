<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-theme-preference="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <title>一幕·YIMU 神笔 · 创作台</title>
  <link rel="modulepreload" href="/v2/js/app.js?v=340">
  <link rel="icon" type="image/png" href="/v2/assets/logo.png">
  <script>
  /* v5.3.0 启动防闪白：必须在样式表加载前执行（本行位于 link 之前，内联脚本阻塞解析，
     CSS 第一次应用时 data-theme / 皮肤底色就已就位），禁缓存冷启动不再白闪。 */
  (function () {
    try {
      var pref = localStorage.getItem('shenbi.v2.theme') || 'system';
      if (pref === 'light') pref = 'paper';
      if (pref === 'dark') pref = 'ink';
      var dark = pref === 'ink' || (pref === 'system' &&
        window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      var root = document.documentElement;
      root.dataset.theme = pref === 'system' ? (dark ? 'ink' : 'paper') : pref;
      var skin = JSON.parse(localStorage.getItem('ew-skin') || 'null');
      if (skin && skin.kind && skin.kind !== 'none') {
        root.dataset.skin = 'on';
        if (skin.base) root.style.setProperty('--skin-base', skin.base);
      }
    } catch (e) { /* 存储不可用等：保持默认浅色即可 */ }
  })();
  </script>
  <!-- settings/skills/chatfloat 三份样式改为路由级按需注入（app.js renderView 里 loadCss） -->
  <link rel="stylesheet" href="/v2/css/tokens.css?v=340">
  <link rel="stylesheet" href="/v2/css/shell.css?v=340">
  <link rel="stylesheet" href="/v2/css/chat.css?v=340">
  <link rel="stylesheet" href="/v2/css/composer.css?v=340">
  <link rel="stylesheet" href="/v2/css/panels.css?v=340">
</head>
<body>
  <!-- v5.3.0 背景皮肤层：fixed 全屏垫底，图片/底色由启动脚本与 theme.js 写入；皮肤未开启时 display:none -->
  <div class="bg-skin" id="bg-skin" aria-hidden="true"></div>

  <a class="skip-link" href="#view">跳到主要内容</a>

  <div class="app" id="app" data-sidebar="expanded" data-right="closed">
    <aside class="sidebar-col" id="sidebar" aria-label="作品导航"></aside>

    <div class="center-col">
      <header class="topbar" id="topbar"></header>
      <main class="center-main" id="view" tabindex="-1"></main>
    </div>

    <aside class="right-col" id="rightbar" aria-label="工作台面板"></aside>

    <div class="resize-handle resize-left" id="handleLeft" role="separator"
         aria-orientation="vertical" aria-label="调整侧栏宽度" tabindex="0"></div>
    <div class="resize-handle resize-right" id="handleRight" role="separator"
         aria-orientation="vertical" aria-label="调整右侧面板宽度" tabindex="0"></div>
    <div class="right-backdrop" id="rightBackdrop" hidden></div>
    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  </div>

  <div class="overlay-layer" id="overlays"></div>
  <div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="/v2/js/app.js?v=340"></script>
</body>
</html>
