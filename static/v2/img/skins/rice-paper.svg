<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- 宣纸纹：细纤维宣纸质感（v5.3.0 内置皮肤，纯矢量自绘；噪点用 feTurbulence 生成） -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f2e6"/>
      <stop offset="1" stop-color="#f1ebdb"/>
    </linearGradient>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.7" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0 0.32  0 0 0 0.05 0"/>
    </filter>
    <filter id="blotch" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.014" numOctaves="3" seed="21" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.47  0 0 0 0 0.33  0 0 0 0.06 0"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect width="1600" height="900" filter="url(#blotch)"/>
  <rect width="1600" height="900" filter="url(#fiber)"/>
  <g stroke="#d8cfba" stroke-width="2" opacity="0.35" fill="none">
    <path d="M0 60 H1600 M0 840 H1600"/>
  </g>
</svg>
