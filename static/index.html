<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神笔文学创作台</title>
<style>
:root{
  --bg:#0d0e12; --panel:#14161c; --card:#1a1d25; --card2:#20242e;
  --border:#262a35; --border2:#333847;
  --text:#e8eaf0; --muted:#8b91a3; --dim:#5c6273;
  --accent:#7c5cff; --accent2:#9d7fff; --green:#3ecf8e; --amber:#f0a13c; --red:#ff6b6b;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;overflow:hidden}
#app{display:flex;height:100vh}

/* ---------- 左侧工作区 ---------- */
#side{width:264px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
#brand{padding:16px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
#brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#4f8cff);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
#brand .bn{font-weight:700;font-size:14px;letter-spacing:.5px}
#brand .bv{font-size:10px;color:var(--muted)}
#newbtn{margin:12px 14px 6px;padding:11px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--accent),#5e6cff);color:#fff;font:600 13.5px var(--sans);cursor:pointer;width:calc(100% - 28px);transition:.15s}
#newbtn:hover{filter:brightness(1.12)}
#newbtn:active{transform:scale(.98)}
#tasklist{flex:1;overflow-y:auto;padding:6px 8px 12px}
.sect{font:600 10.5px var(--sans);color:var(--dim);letter-spacing:1px;padding:12px 8px 5px;text-transform:uppercase}
.trow{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;cursor:pointer;transition:.12s;border:1px solid transparent}
.trow:hover{background:var(--card)}
.trow.on{background:var(--card2);border-color:var(--border2)}
.trow .ticon{font-size:15px;flex:none;width:22px;text-align:center}
.trow .tmain{flex:1;min-width:0}
.trow .tname{font:500 12.5px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tsub{font:400 10.5px var(--sans);color:var(--muted);margin-top:1px}
.tmore{flex:none;border:0;background:none;color:var(--dim);font-size:15px;cursor:pointer;padding:2px 4px;border-radius:6px;letter-spacing:1px}
.tmore:hover{background:var(--card2);color:var(--text)}
.sechead{display:flex;align-items:center;padding:12px 8px 5px;cursor:pointer;user-select:none}
.sechead:hover .sect{color:var(--muted)}
.sechead .car{margin-left:auto;font-size:10px;color:var(--dim);transition:.2s}
.sechead.closed .car{transform:rotate(-90deg)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.run{background:var(--accent);animation:pulse 1.4s infinite}
.dot.done{background:var(--green)}
.dot.pause{background:var(--amber)}
.dot.err{background:var(--red)}
.dot.idle{background:var(--dim)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#sidefoot{border-top:1px solid var(--border);padding:8px}
.fbtn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--muted);font:500 12px var(--sans);cursor:pointer}
.fbtn:hover{background:var(--card);color:var(--text)}

/* ---------- 主区 ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:52px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--panel)}
#topbar .vtitle{font:600 14.5px var(--sans)}
#topbar .vsub{font:400 11.5px var(--sans);color:var(--muted)}
#pselect,#mselect{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 8px;font:12px var(--sans);max-width:170px}
#view{flex:1;overflow-y:auto;position:relative}
#view::-webkit-scrollbar{width:8px}#view::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ---------- 欢迎屏 ---------- */
#welcome{max-width:760px;margin:8vh auto 0;padding:0 24px}
#welcome h1{font:700 26px var(--sans);margin-bottom:8px}
#welcome h1 em{font-style:normal;color:var(--accent2)}
#welcome p.lead{color:var(--muted);font-size:13.5px;line-height:1.8;margin-bottom:26px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:.15s}
.mcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px -12px var(--accent)}
.mcard .mi{font-size:26px;margin-bottom:8px}
.mcard .mt{font:600 14px var(--sans);margin-bottom:4px}
.mcard .md{font:400 11.5px/1.7 var(--sans);color:var(--muted)}

/* ---------- 对话流 ---------- */
#chatwrap{max-width:820px;margin:0 auto;padding:24px 20px 12px}
.bub{margin-bottom:14px;display:flex;gap:10px}
.bub .av{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--card2)}
.bub.bot .av{background:linear-gradient(135deg,var(--accent),#4f8cff)}
.bub .bb{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font:13px/1.85 var(--sans);white-space:pre-wrap;word-break:break-word;max-width:100%;min-width:0}
.bub.user{flex-direction:row-reverse}
.bub.user .bb{background:linear-gradient(135deg,rgba(124,92,255,.16),rgba(79,140,255,.12));border-color:rgba(124,92,255,.35)}
.bub .bb b{color:var(--accent2)}
.livecard{border:1px solid rgba(124,92,255,.4);background:rgba(124,92,255,.07);border-radius:12px;padding:12px 14px;margin-bottom:14px;font:12px/1.8 var(--sans)}
.livecard .ph{color:var(--accent2);font-weight:600}
.pbar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin:8px 0 4px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#4f8cff);border-radius:3px;transition:width .5s}

/* ---------- 输入器 ---------- */
#composer{flex:none;border-top:1px solid var(--border);background:var(--panel);padding:12px 18px 14px}
#chiprow{display:flex;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:16px;padding:4px 12px;font:500 11.5px var(--sans);cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--accent);color:var(--text)}
#inputrow{display:flex;gap:9px;max-width:820px;margin:0 auto}
#inp{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font:13.5px var(--sans);resize:none;outline:none;min-height:44px;max-height:160px;line-height:1.6}
#inp:focus{border-color:var(--accent)}
#send{flex:none;width:44px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),#5e6cff);color:#fff;font-size:16px;cursor:pointer}
#send:disabled{opacity:.4;cursor:not-allowed}

/* ---------- 工作台 ---------- */
#bench{max-width:900px;margin:0 auto;padding:22px 20px}
#bench .bh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
#bench .bh h2{font:700 18px var(--sans)}
.statechip{font:600 10.5px var(--sans);border-radius:10px;padding:3px 9px;letter-spacing:.3px}
.statechip.run{background:rgba(124,92,255,.15);color:var(--accent2)}
.statechip.done{background:rgba(62,207,142,.13);color:var(--green)}
.statechip.pause{background:rgba(240,161,60,.13);color:var(--amber)}
.statechip.err{background:rgba(255,107,107,.13);color:var(--red)}
.statechip.idle{background:var(--card2);color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:14px 0 16px}
.tabs button{border:0;background:none;color:var(--muted);font:500 12.5px var(--sans);padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.panel{display:none}.panel.on{display:block}
.doc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;font:12.5px/1.9 var(--sans);white-space:pre-wrap;word-break:break-word;color:var(--text);max-height:62vh;overflow-y:auto}
.doc:empty::before{content:"（暂无内容）";color:var(--dim)}
.doc .find-blk{color:var(--red)}
.pbtn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:9px;padding:7px 14px;font:500 12px var(--sans);cursor:pointer;transition:.12s}
.pbtn:hover{border-color:var(--accent)}
.pbtn.primary{background:linear-gradient(135deg,var(--accent),#5e6cff);border:0;color:#fff}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.rowbtns{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}

/* ---------- 作品库 ---------- */
#libwrap{max-width:960px;margin:0 auto;padding:22px 20px}
#libwrap h2{font:700 18px var(--sans);margin-bottom:14px}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:9px;cursor:pointer;transition:.13s}
.lrow:hover{border-color:var(--accent)}
.lrow .li{font-size:19px;flex:none;width:30px;text-align:center}
.lrow .lm{flex:1;min-width:0}
.lrow .ln{font:600 13.5px var(--sans)}
.lrow .ls{font:400 11px var(--sans);color:var(--muted);margin-top:2px}
.lrow .lmeta{flex:none;text-align:right;font:500 11.5px var(--sans);color:var(--muted)}
.lrow .lmeta b{color:var(--text);font-size:13px}
.mtag{font:600 9.5px var(--sans);border-radius:6px;padding:2px 7px;margin-left:7px;vertical-align:1px}
.mtag.novel{background:rgba(79,140,255,.14);color:#6ea8ff}
.mtag.script{background:rgba(124,92,255,.14);color:var(--accent2)}
.mtag.poetry{background:rgba(62,207,142,.13);color:var(--green)}
.mtag.prose{background:rgba(240,161,60,.13);color:var(--amber)}

/* ---------- 弹层 ---------- */
#ovl{position:fixed;inset:0;background:rgba(8,9,12,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100}
#ovl.show{display:flex}
#dlg{background:var(--panel);border:1px solid var(--border2);border-radius:16px;padding:22px;width:600px;max-width:94vw;max-height:88vh;overflow-y:auto;box-shadow:0 24px 80px -24px rgba(0,0,0,.8)}
#dlg h3{font:700 16px var(--sans);margin-bottom:4px}
#dlg .dsub{font:400 11.5px var(--sans);color:var(--muted);margin-bottom:16px}
.flabel{font:500 11.5px var(--sans);color:var(--muted);margin:12px 0 5px;display:block}
.fin,.fsel,.ftext{width:100%;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 11px;color:var(--text);font:13px var(--sans);outline:none}
.fin:focus,.fsel:focus,.ftext:focus{border-color:var(--accent)}
.ftext{resize:vertical;min-height:72px;line-height:1.7}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.selgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.selcard{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px;cursor:pointer;transition:.14s;text-align:left}
.selcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.selcard .si{font-size:23px;margin-bottom:7px}
.selcard .st{font:600 13.5px var(--sans);margin-bottom:3px}
.selcard .sd{font:400 10.5px/1.65 var(--sans);color:var(--muted)}
.backlink{font:500 11.5px var(--sans);color:var(--muted);cursor:pointer;margin-bottom:10px;display:inline-block}
.backlink:hover{color:var(--accent2)}
.tagpick{display:flex;flex-wrap:wrap;gap:7px}
.tagpick .tag{border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:14px;padding:4px 12px;font:12px var(--sans);cursor:pointer}
.tagpick .tag.on{border-color:var(--accent);color:var(--text);background:rgba(124,92,255,.14)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tcard{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--card);cursor:pointer;transition:.12s}
.tcard:hover{border-color:var(--accent)}
.tcard.on{border-color:var(--accent);background:rgba(124,92,255,.13)}
.tcard .tt{font:600 12.5px var(--sans)}
.tcard .tw{font:400 10.5px var(--sans);color:var(--muted);margin-top:3px;line-height:1.6}
.dbtns{display:flex;gap:9px;margin-top:18px;justify-content:flex-end}
.loading{display:flex;align-items:center;gap:10px;padding:14px;color:var(--muted);font:12.5px var(--sans)}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 上下文菜单（3 点） ---------- */
#ctxmenu{position:fixed;z-index:300;background:var(--card2);border:1px solid var(--border2);border-radius:11px;padding:5px;min-width:190px;box-shadow:0 12px 40px -8px rgba(0,0,0,.7);display:none}
#ctxmenu.show{display:block}
#ctxmenu .citem{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);font:500 12.5px var(--sans);padding:8px 11px;border-radius:7px;cursor:pointer}
#ctxmenu .citem:hover{background:var(--card)}
#ctxmenu .citem.danger{color:var(--red)}
#ctxmenu .csep{height:1px;background:var(--border);margin:4px 6px}
.mwrap{position:relative;display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}
.mwrap select.fsel{width:auto;min-width:110px}
/* ---------- 大弹窗（工作/设置） ---------- */
#dlg.wide{width:860px;max-height:90vh}
#dlg .mbody{max-height:calc(88vh - 96px);overflow-y:auto;padding-right:4px}
.kvrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font:12.5px var(--sans)}
.kvrow .k{color:var(--muted)}
.kvrow .v{color:var(--text);font-weight:500}
.mgrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.statchip2{display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:5px 12px;font:600 12px var(--sans);color:var(--text)}
.agrow{border:1px solid var(--border);background:var(--card);border-radius:11px;padding:11px;margin-bottom:9px}
.agrow .aglabel{font:600 12.5px var(--sans)}
.agrow .agdesc{font:400 10.5px var(--sans);color:var(--muted);margin:2px 0 7px}
.agrow select{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:5px 8px;font:11.5px var(--sans)}
.lrnrow{display:flex;align-items:center;gap:9px;font:12px var(--sans);margin-bottom:7px}
.lrnrow .ln{width:64px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.lrnrow .lbar{flex:1;height:6px;background:var(--card2);border-radius:4px;overflow:hidden}
.lrnrow .lbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#3ad29b)}
.lrnrow .lc{width:36px;text-align:right;color:var(--muted)}
.scoretbl{width:100%;border-collapse:collapse;font:12px var(--sans)}
.scoretbl th,.scoretbl td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left}
.scoretbl th{color:var(--muted);font-weight:500}
.scoretbl td.below{color:var(--amber);font-weight:600}
.evtl{border-left:2px solid var(--border2);margin-left:8px;padding-left:14px}
.evtl .ev{position:relative;padding:5px 0;font:12px/1.7 var(--sans);color:var(--muted)}
.evtl .ev::before{content:"";position:absolute;left:-18.5px;top:11px;width:7px;height:7px;border-radius:50%;background:var(--dim)}
.evtl .ev:first-child::before{background:var(--accent)}

#toasts{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card2);border:1px solid var(--border2);border-radius:11px;padding:10px 15px;font:12.5px var(--sans);box-shadow:0 8px 30px -8px rgba(0,0,0,.6);animation:tin .25s;max-width:340px}
.toast.ok{border-color:rgba(62,207,142,.5)}
.toast.err{border-color:rgba(255,107,107,.5)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
  <!-- 左侧工作区 -->
  <aside id="side">
    <div id="brand">
      <div class="logo">笔</div>
      <div><div class="bn">神笔</div><div class="bv">文学创作台 <span id="verbadge"></span></div></div>
    </div>
    <button id="newbtn">＋ 新建创作</button>
    <div id="tasklist"><div class="sechead" id="taskhead" onclick="toggleSection('tasks')"><div class="sect">任务</div><span class="car">▼</span></div><div id="tasks"></div></div>
    <div id="sidefoot">
      <div class="fbtn" id="libbtn">📚 全部作品 <span id="libcar" style="margin-left:auto;font-size:10px;color:var(--dim)">▸</span></div>
      <div class="fbtn" id="setbtn">⚙️ 模型与设置</div>
    </div>
  </aside>
  <!-- 主区 -->
  <main id="main">
    <div id="topbar">
      <div style="flex:1;min-width:0">
        <div class="vtitle" id="vtitle">工作台</div>
        <div class="vsub" id="vsub"></div>
      </div>
      <select id="pselect" title="供应商"></select>
      <select id="mselect" title="模型"></select>
    </div>
    <div id="view"></div>
    <div id="composer">
      <div id="chiprow">
        <span class="chip" onclick="openNew('novel')">📖 小说</span>
        <span class="chip" onclick="openNew('script')">🎬 剧本</span>
        <span class="chip" onclick="openNew('poetry')">🖋 诗词</span>
        <span class="chip" onclick="openNew('prose')">✒️ 散文</span>
      </div>
      <div id="inputrow">
        <textarea id="inp" rows="1" placeholder="直接输入：如「写一部都市悬疑，退休刑警翻盘，20章」——或点上方选择创作类型"></textarea>
        <button id="send">➤</button>
      </div>
    </div>
  </main>
</div>
<div id="ovl"><div id="dlg"></div></div>
<div id="ctxmenu"></div>
<div id="toasts"></div>
<script>
"use strict";
/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">",'"':'"',"'":"&#39;"}[c]));
async function api(url,opt){
  const r=await fetch(url,Object.assign({headers:{"Content-Type":"application/json"}},opt||{}));
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok||j.error)throw new Error(j.error||("HTTP "+r.status));
  return j;
}
function toast(msg,type){
  const t=document.createElement("div");t.className="toast "+(type||"");t.innerHTML=msg;
  $("toasts").appendChild(t);setTimeout(()=>{t.style.opacity="0";t.style.transition=".3s";setTimeout(()=>t.remove(),320);},3200);
}
const MEDIUM={novel:{icon:"📖",label:"小说",cls:"novel"},script:{icon:"🎬",label:"剧本",cls:"script"},
              poetry:{icon:"🖋",label:"诗词",cls:"poetry"},prose:{icon:"✒️",label:"散文",cls:"prose"}};

loadTasks=async function(){
  try{
    const [lib,sc,po,pr]=await Promise.all([
      api("/api/library").catch(()=>({items:[]})),
      api("/api/script/projects").catch(()=>[]),
      api("/api/poetry/projects").catch(()=>[]),
      api("/api/prose/projects").catch(()=>({items:[]})),
    ]);
    const pins=JSON.parse(localStorage.nbot_pins||"[]");
    const rows=[];
    (lib.items||[]).forEach(i=>rows.push({key:i.key,medium:"novel",name:i.name,state:i.state,sub:(i.done||0)+"/"+(i.total||0)+" 章 · "+((i.total_words||0)/10000).toFixed(1)+"万字"}));
    (Array.isArray(sc)?sc:[]).forEach(i=>rows.push({key:i.key,medium:"script",name:i.name,state:i.status||i.state,sub:(i.done||0)+"/"+(i.total||0)+" 场"+(i.form?" · "+i.form:"")}));
    (Array.isArray(po)?po:[]).forEach(i=>rows.push({key:i.key,medium:"poetry",name:i.name,state:i.status,sub:(i.form||"")+(i.verdict?" · "+i.verdict:"")}));
    ((pr&&pr.items)||[]).forEach(i=>rows.push({key:i.key,medium:"prose",name:i.name,state:i.state,sub:(i.form||"")+(i.operation?" · "+i.operation:"")}));
    rows.sort((a,b)=>{const pa=pins.indexOf(a.key),pb=pins.indexOf(b.key);return (pa<0?999:pa)-(pb<0?999:pb);});
    const box=$("tasks");
    if(!rows.length){box.innerHTML='<div style="padding:14px 10px;font:11.5px var(--sans);color:var(--dim)">暂无任务。点「＋ 新建创作」开始。</div>';return;}
    box.innerHTML=rows.map(r=>{
      const m=MEDIUM[r.medium],d=STATEMAP[r.state]||"idle";
      const on=(CUR==="chat"&&KEY===r.key)||(CUR==="bench"&&KEY===r.key);
      return `<div class="trow${on?" on":""}" data-m="${r.medium}" data-k="${esc(r.key)}">
        <div class="ticon">${m.icon}</div>
        <div class="tmain" data-open="1"><div class="tname">${esc(r.name||r.key)}</div><div class="tsub">${esc(r.sub)}</div></div>
        <span class="dot ${d}" title="${esc(r.state||"")}"></span>
        <button class="tmore" data-menu="1" title="更多操作">⋯</button></div>`;
    }).join("");
    box.querySelectorAll(".trow").forEach(row=>{
      const m=row.dataset.m,k=row.dataset.k;
      row.querySelector('[data-open]').onclick=()=>openTask(m,k);
      row.querySelector(".tmore").onclick=e=>{
        e.stopPropagation();
        const rct=e.target.getBoundingClientRect();
        if(m==="novel")novelMenu(k,rct.left-160,rct.bottom+4);
        else benchMenu(m,k,rct.left-160,rct.bottom+4);
      };
    });
  }catch(e){}
};

/* ================= 对话流（小说） ================= */
function bubble(role,text){
  const wrap=$("chatwrap")||createChatWrap();
  const b=document.createElement("div");b.className="bub "+role;
  b.innerHTML=`<div class="av">${role==="bot"?"笔":"我"}</div><div class="bb">${esc(text)}</div>`;
  wrap.appendChild(b);$("view").scrollTop=$("view").scrollHeight;
  return b;
}
function createChatWrap(){
  const v=$("view");v.innerHTML='<div id="chatwrap"></div>';return $("chatwrap");
}
async function openBook(key){
  CUR="chat";KEY=key;SID="bk-"+key;stopPoll();VIEWTOK++;
  const tok=VIEWTOK;
  switchView("chat","小说对话","加载中…");
  createChatWrap();
  let st={};
  try{st=await api("/api/status?key="+encodeURIComponent(key));}catch(e){}
  if(tok!==VIEWTOK)return;
  $("vsub").textContent="《"+(st.name||key)+"》 · "+(st.done||0)+"/"+(st.total||0)+" 章 · "+((st.words||0)/10000).toFixed(1)+"万字";
  // 加载本书专属历史对话（bkchat），再放欢迎语
  try{
    const bc=await api("/api/bkchat?key="+encodeURIComponent(key));
    if(tok!==VIEWTOK)return;
    (bc.messages||[]).slice(-30).forEach(m=>bubble(m.who==="bot"?"bot":"user",m.text));
  }catch(e){}
  if(!(await Promise.resolve($("chatwrap").children.length)))
    bubble("bot","📖 已打开《"+(st.name||key)+"》。直接说话（写/继续/改写），或点右侧 ⋯ 更多操作。");
  pollLive(key,tok);
  loadTasks();
}
async function pollLive(key,tok){
  const wrap=$("chatwrap");if(!wrap)return;
  const card=document.createElement("div");card.className="livecard";wrap.appendChild(card);
  const PHASE={plan:"📐 规划中",write:"✍️ 写作中",parallel:"⚡ 并行写作",rewriting:"🔁 重写中",
               releasing:"🔓 放行门禁",one_shot:"✨ 一键完稿",validate:"📝 审稿中",
               done:"✅ 已完成",failed:"⚠️ 失败",idle:"⏸ 待机",paused:"⏸ 已暂停"};
  const tick=async()=>{
    if(tok!==VIEWTOK||CUR!=="chat"){clearInterval(POLL);POLL=null;return;}
    try{
      const lv=await api("/api/book-live?key="+encodeURIComponent(key));
      if(tok!==VIEWTOK)return;
      const pct=(lv.progress&&lv.progress.pct)||0;
      const done=(lv.progress&&lv.progress.done)||0,total=(lv.progress&&lv.total||lv.progress&&lv.progress.total)||0;
      const log=(lv.live_log||[]),last=log.length?log[log.length-1]:"";
      card.innerHTML=`<span class="ph">${esc(PHASE[lv.phase]||lv.phase||"待机")}</span>
        <div class="pbar"><i style="width:${pct}%"></i></div>
        <div style="color:var(--muted)">${done}/${total} 章 · ${(lv.state||"")}${last?" · "+esc(last.slice(0,90)):""}</div>`;
    }catch(e){}
  };
  await tick();
  POLL=setInterval(tick,2500);
}
async function sendMsg(){
  const inp=$("inp"),text=inp.value.trim();if(!text)return;
  inp.value="";inp.style.height="auto";
  if(CUR!=="chat"||!KEY){toast("先打开或新建一个作品");return;}
  bubble("user",text);
  try{
    // 中间台指令解析：改写某章/全书/看评分 → 结构化动作
    let cr={};
    try{cr=await api("/api/cmd",{method:"POST",body:JSON.stringify({key:KEY,text})});}catch(e){}
    if(cr&&cr.action&&cr.action!=="chat"){
      await execCmd(cr,text);
      return;
    }
    const r=await api("/api/chat",{method:"POST",body:JSON.stringify({session_id:SID,message:text,...provPayload()})});
    bubble("bot",r.reply||"（空回复）");
    // 记入本书专属对话
    try{await api("/api/bkchat",{method:"POST",body:JSON.stringify({key:KEY,who:"user",text})});}catch(e){}
    try{await api("/api/bkchat",{method:"POST",body:JSON.stringify({key:KEY,who:"bot",text:r.reply||""})});}catch(e){}
    if(r.project&&r.project!==KEY){KEY=r.project;SID="bk-"+r.project;}
    loadTasks();
  }catch(e){bubble("bot","⚠️ "+String(e));}
}
async function execCmd(cr,text){
  const k=cr.key||KEY;
  if(cr.action==="scores"){
    bubble("bot","📊 拉取逐章评分…");
    try{const pv=await api("/api/preview?key="+encodeURIComponent(k));
      const rows=(pv.per_chapter||[]).map(p=>`第${p.ch}章 ${p.score!=null?p.score+"分":"未评"}${p.status==="below"?" ⚠️低于达标线":""}`).join("\n");
      bubble("bot","📊 逐章评分（达标线 "+(pv.pass_line||90)+"）：\n"+(rows||"暂无评分，先跑审稿。"));
    }catch(e){bubble("bot","⚠️ "+String(e));}
  }else if(cr.action==="rewrite_chapter"){
    openRewriteModal(k,[cr.chapter]);
  }else if(cr.action==="rewrite_all"){
    openRewriteModal(k,null);
  }else if(cr.action==="rewrite_section"){
    bubble("bot","✒️ 收到：改写第 "+cr.chapter+" 章里的一小段…");
    try{
      const match=(text.replace(/(改写|重写|把|将|第\d+章|那段|那段话|一小段|一段)/g," ").trim()).slice(0,30);
      const j=await api("/api/rewrite-section",{method:"POST",body:JSON.stringify({key:k,chapter:cr.chapter,match,instruction:"把这一段写得更抓人，去掉 AI 腔，加细节与张力"})});
      bubble("bot","✒️ 第 "+cr.chapter+" 章该段已改写。\n原："+(j.orig||"").slice(0,120)+"\n新："+(j.new||"").slice(0,120));
    }catch(e){bubble("bot","⚠️ "+String(e));}
  }
}

let BENCHTAB="scenes",BENCHK=null;
async function openBench(medium,key){
  const cfg=BENCH[medium];if(!cfg)return;
  CUR="bench";KEY=key;BENCHK=key;BENCHTAB=cfg.tabs[0][0];stopPoll();VIEWTOK++;
  const tok=VIEWTOK;
  switchView("bench",cfg.title,"加载中…");
  $("view").innerHTML=`<div id="bench">
    <div class="bh"><h2 id="bh_name">…</h2><span class="statechip idle" id="bh_state"></span>
      <div style="flex:1"></div><button class="pbtn" onclick="loadTasks();toast('已刷新')">刷新</button></div>
    <div class="pbar" id="bh_bar" style="max-width:280px"><i id="bh_pfill" style="width:0"></i></div>

    <div class="doc" id="bh_doc"></div></div>`;
  $("bh_tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{BENCHTAB=b.dataset.t;benchTab(medium,key,tok);});

      const st=await api(ep+"?key="+encodeURIComponent(key));

function benchState(st){
  const d=STATEMAP[st.state]||"idle";
  const chip=$("bh_state");if(!chip)return;
  chip.className="statechip "+d;chip.textContent=st.state||"—";
  $("bh_name").textContent=st.name||BENCHK;
  const pct=st.total?Math.round((st.done||0)/st.total*100):0;
  $("bh_pfill").style.width=pct+"%";
  $("vsub").textContent=(st.form?st.form+" · ":"")+(st.done||0)+"/"+(st.total||0)+(CUR_M()!=="poetry"?" 场":" 轮")+" · "+((st.words||0)/1000).toFixed(1)+"k字";
}
function CUR_M(){for(const m in BENCH){}return "script";}
async function benchTab(medium,key,tok){
  const cfg=BENCH[medium];
  $("bh_tabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===BENCHTAB));
  const doc=$("bh_doc");
  doc.innerHTML='<div class="loading"><div class="spinner"></div>加载中…</div>';
  try{
    const j=await cfg.fetch(key,BENCHTAB);
    if(tok!==VIEWTOK)return;
    let txt=cfg.pick(j);
    if(medium==="prose"&&BENCHTAB==="slop"&&txt){txt=txt;} // 已是报告文本
    doc.textContent=txt||"";
    if(medium==="script"&&BENCHTAB==="scenes"&&Array.isArray(j.scenes)){
      // 场次支持「写一场」
      const btns=document.createElement("div");btns.className="rowbtns";
      const sel=document.createElement("select");sel.className="fsel";sel.style.width="120px";
      sel.innerHTML=j.scenes.map(s=>`<option value="${s.no||s.sceneNo}">第${s.no||s.sceneNo}场</option>`).join("");
      const wb=document.createElement("button");wb.className="pbtn primary";wb.textContent="✍️ 写这一场";
      wb.onclick=async()=>{wb.disabled=true;wb.textContent="写作中…";
        try{await api("/api/script/write",{method:"POST",body:JSON.stringify({key,sceneNo:parseInt(sel.value,10)})});toast("本场完成","ok");benchTab(medium,key,tok);}
        catch(e){toast("失败："+esc(String(e)),"err");wb.disabled=false;wb.textContent="✍️ 写这一场";}};
      btns.appendChild(sel);btns.appendChild(wb);doc.after(btns);
    }
  }catch(e){doc.textContent="加载失败："+String(e);}
}

const PROV_PRESETS=[["agnes","Agnes AI"],["openai","OpenAI"],["deepseek","DeepSeek"],["qwen","通义千问"],["glm","智谱 GLM"],["kimi","Moonshot Kimi"],["ollama","Ollama 本地"]];
function providerForm(pid){
  const dlg=$("dlg");$("ovl").classList.add("show");
  const title=pid?"✏️ 编辑供应商":"＋ 新增供应商";
  dlg.innerHTML=`<h3>${title}</h3><div class="dsub">OpenAI 兼容接口。预设会自动填 base_url 和模型清单；自定义就全部手填。</div>
  ${pid?"":`<label class="flabel">预设（可选，一键填）</label><select class="fsel" id="pf_preset"><option value="">（自定义）</option>${PROV_PRESETS.map(p=>`<option value="${p[0]}">${p[1]}</option>`).join("")}</select>`}
  <label class="flabel">ID（英文标识，唯一）</label><input class="fin" id="pf_id" value="${pid||""}" ${pid?"readonly style=opacity:.6":""} placeholder="如 myprovider">
  <label class="flabel">名称</label><input class="fin" id="pf_name" placeholder="如 我的供应商">
  <label class="flabel">Base URL</label><input class="fin" id="pf_url" placeholder="https://api.xxx.com/v1">
  <label class="flabel">API Key（留空=不修改）</label><input class="fin" id="pf_key" type="password" placeholder="sk-...">
  <label class="flabel">模型清单（可手动填，或点「拉取」自动获取）</label>
  <div style="display:flex;gap:8px"><input class="fin" id="pf_models" placeholder="model-a, model-b" style="flex:1">
  <button class="pbtn" id="pf_fetch" type="button">🔄 拉取模型</button></div>
  <label class="flabel">默认模型（下拉选择）</label><select class="fsel" id="pf_defm"><option value="">（先填/拉取模型清单）</option></select>
  <div class="f2"><div><label class="flabel">温度</label><input class="fin" id="pf_temp" type="number" step="0.05" value="0.85"></div>
  <div style="align-self:end"><label class="flabel">&nbsp;</label><button class="pbtn" id="pf_probe" type="button" style="width:100%">🔍 测试连通</button></div></div>
  <div class="dbtns"><button class="pbtn" onclick="loadSetTab('models');openSettings('models')">取消</button><button class="pbtn primary" id="pf_go">保存</button></div>`;
  if(!pid){
    dlg.querySelector("#pf_preset").onchange=async function(){
      if(!this.value)return;
      try{
        const map={agnes:["https://api.agnesai.cn/v1","agnes-3.0-flash"],openai:["https://api.openai.com/v1","gpt-4o"],deepseek:["https://api.deepseek.com/v1","deepseek-chat"],qwen:["https://dashscope.aliyuncs.com/compatible-mode/v1","qwen-plus"],glm:["https://open.bigmodel.cn/api/paas/v4","glm-4-plus"],kimi:["https://api.moonshot.cn/v1","moonshot-v1-8k"],ollama:["http://127.0.0.1:11434/v1","llama3"]};
        const m=map[this.value]||["",""];
        dlg.querySelector("#pf_url").value=m[0];dlg.querySelector("#pf_defm").value=m[1];
        dlg.dataset.preset=this.value;
      }catch(e){}
    };
  }else{
    // 编辑：载入现有模型清单到下拉
    api("/api/providers/"+encodeURIComponent(pid)+"/models").then(j=>{
      pfFillModels(j.models||[]);
      dlg.querySelector("#pf_models").value=(j.models||[]).join(", ");
    }).catch(()=>{});
  }
  // 模型清单输入变化 → 同步下拉
  dlg.querySelector("#pf_models").addEventListener("change",()=>{
    pfFillModels(dlg.querySelector("#pf_models").value.split(",").map(x=>x.trim()).filter(Boolean));
  });
  // 拉取模型（对已有供应商走后端 /models 拉取；新表单先用 base_url+key 直接探测）
  dlg.querySelector("#pf_fetch").onclick=async()=>{
    const btn=dlg.querySelector("#pf_fetch");btn.disabled=true;btn.textContent="拉取中…";
    try{
      if(pid){
        const j=await api("/api/providers/"+encodeURIComponent(pid)+"/models",{method:"POST"});
        pfFillModels(j.models||[]);
        dlg.querySelector("#pf_models").value=(j.models||[]).join(", ");
        toast(j.from_api?("✅ 拉到 "+(j.models||[]).length+" 个模型"):(j.msg||"未开放 /models，手动填"),j.from_api?"ok":"err");
      }else{
        const url=dlg.querySelector("#pf_url").value.replace(/\/+$/,"");
        const key=dlg.querySelector("#pf_key").value.trim();
        if(!url){toast("先填 Base URL","err");return;}
        const r=await fetch(url+"/models",{headers:key?{Authorization:"Bearer "+key}:{}});
        const j=await r.json();
        const ms=(j.data||j.models||[]).map(m=>m.id||m.name||m).filter(Boolean);
        pfFillModels(ms);
        dlg.querySelector("#pf_models").value=ms.join(", ");
        toast(ms.length?("✅ 拉到 "+ms.length+" 个模型"):"拉取失败，请手动填",ms.length?"ok":"err");
      }
    }catch(e){toast("拉取失败："+String(e)+"（可手动填）","err");}
    btn.disabled=false;btn.textContent="🔄 拉取模型";
  };
  // 测试连通（新表单即时测试）
  dlg.querySelector("#pf_probe").onclick=async()=>{
    if(!pid){toast("新供应商请先保存再测试","err");return;}
    testProvider(pid);
  };
  dlg.querySelector("#pf_go").onclick=async()=>{
    const g=id=>dlg.querySelector(id).value.trim();
    const payload={id:g("#pf_id"),name:g("#pf_name"),base_url:g("#pf_url"),
      models:g("#pf_models")?g("#pf_models").split(",").map(x=>x.trim()).filter(Boolean):undefined,
      default_model:g("#pf_defm")||undefined,temperature:parseFloat(g("#pf_temp"))||0.85};
    if(g("#pf_key"))payload.api_key=g("#pf_key");
    if(!pid&&dlg.dataset.preset)payload.preset=dlg.dataset.preset;
    try{
      if(pid)await api("/api/providers/"+encodeURIComponent(pid),{method:"PUT",body:JSON.stringify(payload)});
      else await api("/api/providers",{method:"POST",body:JSON.stringify(payload)});
      toast(pid?"供应商已更新":"供应商已添加","ok");
      openSettings("models");
    }catch(e){toast("保存失败："+String(e),"err");}
  };
}
function pfFillModels(models){
  const sel=$("pf_defm");if(!sel)return;
  const cur=sel.value;
  sel.innerHTML=(models&&models.length?models.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join(""):"<option value=''>（先填/拉取模型清单）</option>");
  if(models&&models.includes(cur))sel.value=cur;
}

  <label class="flabel">正文 markdown</label><textarea class="ftext" id="sk_content" rows="10" placeholder="## 我的写作纪律&#10;- 关键场景先写五感&#10;- 每章结尾留具体疑问…"></textarea>
  <div class="dbtns"><button class="pbtn" onclick="openSettings('skills')">取消</button><button class="pbtn primary" id="sk_go">保存技能</button></div>`;
  dlg.querySelectorAll("#sk_medium .tag").forEach(t=>t.onclick=()=>{t.classList.toggle("on");if(t.dataset.v==="all"&&t.classList.contains("on"))dlg.querySelectorAll("#sk_medium .tag").forEach(x=>{if(x.dataset.v!=="all")x.classList.remove("on");});else if(t.dataset.v!=="all"){const a=dlg.querySelector('#sk_medium .tag[data-v="all"]');if(a)a.classList.remove("on");}});
  dlg.querySelector("#sk_go").onclick=async()=>{
    const media=[...dlg.querySelectorAll("#sk_medium .tag.on")].map(t=>t.dataset.v);
    try{
      await api("/api/skillkit/add",{method:"POST",body:JSON.stringify({
        name:dlg.querySelector("#sk_name").value.trim(),
        title:dlg.querySelector("#sk_title").value.trim(),
        medium:media.length?media:["all"],
        stages:dlg.querySelector("#sk_stages").value.split(",").map(x=>x.trim()).filter(Boolean),
        kind:dlg.querySelector("#sk_kind").value,
        weight:+dlg.querySelector("#sk_weight").value||4,
        content:dlg.querySelector("#sk_content").value})});
      toast("✅ 技能已保存并生效","ok");openSettings("skills");
    }catch(e){toast("保存失败："+String(e),"err");}
  };
}
async function delSkill(name){
  uniConfirm("删除自定义技能","删除 "+name+"？立即生效。","删除",async()=>{
    try{await api("/api/skillkit/custom/"+encodeURIComponent(name),{method:"DELETE"});toast("已删除","ok");openSettings("skills");}catch(e){toast(String(e),"err");}});
}
async function previewSkill(relpath){
  try{
    const j=await api("/api/skillkit/preview?stage=P2&medium=novel&max_bytes=60000");
    // 直接读文件内容：走 preview 不合适，改用专用读取——暂用 list 里的路径拼 fetch
    const dlg=$("dlg");$("ovl").classList.add("show");
    dlg.innerHTML=`<h3>👁 ${esc(relpath)}</h3><div class="mbody"><div class="doc" id="skpv">加载中…</div></div>
    <div class="dbtns"><button class="pbtn" onclick="openSettings('skills')">关闭</button></div>`;
    // 后端没有单文件读取端点 → 通过 preview 注入内容近似展示不可靠，这里直接提示查看文件路径
    $("skpv").textContent="文件位于 skillkit/"+relpath+"（可在编辑器中打开查看与修改，保存后刷新技能库即生效）。";
  }catch(e){toast(String(e),"err");}
}
window.addSkill=addSkill;window.delSkill=delSkill;window.previewSkill=previewSkill;

/* ================= 侧栏拖拽调宽 ================= */
(function(){
  const side=$("side");
  const grip=document.createElement("div");
  grip.style.cssText="width:5px;cursor:col-resize;flex:none;background:transparent;transition:.15s;position:relative;z-index:5";
  grip.onmouseenter=()=>grip.style.background="var(--accent)";
  grip.onmouseleave=()=>grip.style.background="transparent";
  side.after(grip);
  let dragging=false;
  grip.addEventListener("mousedown",e=>{dragging=true;document.body.style.cursor="col-resize";e.preventDefault();});
  document.addEventListener("mousemove",e=>{
    if(!dragging)return;
    const w=Math.max(200,Math.min(460,e.clientX));
    side.style.width=w+"px";
  });
  document.addEventListener("mouseup",()=>{if(dragging){dragging=false;document.body.style.cursor="";localStorage.yimu_sidew=side.style.width;}});
  const saved=localStorage.yimu_sidew;if(saved)side.style.width=saved;
})();
