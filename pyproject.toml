[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["bot", "tests"]

[tool.ruff.lint]
# 大厂基线：抓真 bug（F 未定义/未用、B bugbear、UP 语法升级），
# 忽略本代码库长期沿用的风格项（合并 import / 分号 / 行长），避免大面积 churn。
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501", "E401", "E402", "E702", "E731", "E741", "E701", "F541",
    "B008", "B006", "B011",
    "UP031", "UP035", "UP037",
    # UP038：新版 ruff 才有的 isinstance 元组写法规则。基座代码长期用 (int, float)
    # 风格（Python 3.10+ 运行没问题），改动会造成大面积 churn，故不强制。
    "UP038",
]

[tool.ruff.lint.per-file-ignores]
# 测试脚本允许 sys.path hack + 合并 import
"tests/*.py" = ["E402"]
# 历史大文件（writer/app）暂不强制未用变量/括号清理，聚焦抓真 bug；新代码仍走全局基线
"bot/writer.py" = ["F401", "F841", "UP034"]
"app.py" = ["F401", "F841", "UP034"]
