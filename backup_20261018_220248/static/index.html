<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神笔 · 小说创作机器人</title>
<style>
:root{
  --bg:#0a0e1a; --panel:rgba(255,255,255,.055); --panel2:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.12); --text:#e8ecf5; --muted:#8b93a7;
  --accent:#6c8cff; --accent2:#a06cff; --ok:#4ade80; --warn:#fbbf24; --err:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 800px at 20% -10%,#1a2246 0%,var(--bg) 55%),
             radial-gradient(1000px 700px at 110% 110%,#2a1a4a 0%,transparent 60%),var(--bg);
  color:var(--text);overflow:hidden;
}
#app{display:flex;height:100vh}
/* 聊天区 */
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#head{padding:18px 26px;border-bottom:1px solid var(--border);background:var(--panel);backdrop-filter:blur(14px);display:flex;align-items:center;gap:12px}
#head .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:20px}
#head h1{font-size:17px;font-weight:600}
#head p{font-size:11.5px;color:var(--muted);margin-top:2px}
#msgs{flex:1;overflow-y:auto;padding:26px;scroll-behavior:smooth}
.msg{display:flex;margin-bottom:16px;gap:10px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.ava{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.msg.bot .ava{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.msg.user .ava{background:var(--panel2);border:1px solid var(--border)}
.bubble{max-width:640px;padding:13px 16px;border-radius:14px;font-size:14.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.msg.bot .bubble{background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(10px)}
.msg.user .bubble{background:linear-gradient(135deg,rgba(108,140,255,.25),rgba(160,108,255,.25));border:1px solid rgba(108,140,255,.35)}
.thinking{color:var(--muted);font-size:13px;padding:4px 0}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:5px;animation:blink 1s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
#inputbar{padding:16px 26px 20px;border-top:1px solid var(--border);background:var(--panel);backdrop-filter:blur(14px)}
#inputrow{display:flex;gap:10px;max-width:760px;margin:0 auto}
#inp{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:13px;padding:12px 15px;color:var(--text);font-size:14.5px;outline:none;resize:none;height:52px;font-family:inherit;transition:border .2s}
#inp:focus{border-color:var(--accent)}
#send{width:52px;border:none;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:18px;cursor:pointer;transition:transform .15s}
#send:hover{transform:scale(1.06)}
/* 侧栏 */
#side{width:320px;border-left:1px solid var(--border);background:rgba(10,14,26,.6);backdrop-filter:blur(16px);display:flex;flex-direction:column;overflow-y:auto}
#side h2{font-size:13px;color:var(--muted);padding:16px 18px 8px;font-weight:500;letter-spacing:.5px}
#prog{margin:0 14px 10px;border-radius:14px;padding:14px;background:var(--panel);border:1px solid var(--border);display:none}
#prog .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0 8px}
#prog .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s;border-radius:3px}
#prog .prow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
#evts{margin:6px 14px;font-size:11.5px;color:var(--muted);max-height:150px;overflow-y:auto;line-height:1.7}
.pitem{margin:0 14px 8px;border-radius:13px;background:var(--panel);border:1px solid var(--border);padding:12px 14px;cursor:pointer;transition:background .2s}
.pitem:hover{background:var(--panel2)}
.pitem .t{font-size:13.5px;font-weight:600;margin-bottom:5px}
.pitem .s{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:1px}
.tag.done{background:rgba(74,222,128,.15);color:var(--ok)}
.tag.run{background:rgba(251,191,36,.15);color:var(--warn)}
.tag.wait{background:rgba(139,147,167,.15);color:var(--muted)}
#dow{display:inline-block;margin-top:9px;font-size:11.5px;color:var(--accent);text-decoration:none;border:1px solid rgba(108,140,255,.4);padding:4px 12px;border-radius:20px}
.empty{padding:14px;color:var(--muted);font-size:12.5px;text-align:center}
#read{width:100%;margin-top:6px}
/* 供应商面板 */
#side .secrow{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
#side .secrow h2{padding:16px 14px 8px}
#addprov{font-size:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;padding:5px 11px;border-radius:8px;cursor:pointer}
#addprov:hover{transform:scale(1.03)}
.vitem{margin:0 14px 9px;border-radius:13px;background:var(--panel);border:1px solid var(--border);padding:11px 13px}
.vitem.off{opacity:.62}
.vitem .vh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.vitem .vh .vname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vitem .vdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0}
.vitem.off .vdot{background:var(--muted)}
.vitem .vdef{font-size:10.5px;color:var(--warn);flex-shrink:0}
.vitem .vrow{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.vitem .vstat{font-size:11px;color:var(--muted)}
.vitem .vbtn{font-size:11px;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:3px 8px;border-radius:7px;cursor:pointer}
.vitem .vbtn:hover{border-color:var(--accent)}
.vitem .vbtn.danger{color:var(--err)}
.vitem .vbtn.def{color:var(--warn)}
.vitem .vbtn.busy{color:var(--accent);pointer-events:none}
.vitem .vmodels{margin-top:8px;font-size:11px;color:var(--muted);line-height:1.6}
.vitem .vmodels .mtag{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:1px 7px;margin:2px 4px 0 0}
.vitem .vmodels .mtag.cur{border-color:var(--accent);color:var(--accent)}
.vitem .vkey{margin-top:5px;font-size:10.5px;color:var(--muted)}
/* 模态 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50}
.modal.show{display:flex}
.modal .mbox{width:460px;max-width:92vw;max-height:88vh;overflow-y:auto;background:rgba(16,20,38,.97);border:1px solid var(--border);border-radius:18px;padding:20px 22px}
.modal h3{font-size:15px;margin-bottom:4px}
.modal .mhint{font-size:11.5px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.mfield{margin-bottom:11px}
.mfield label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.mfield input,.mfield select,.mfield textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:9px;padding:8px 10px;color:var(--text);font-size:13px;font-family:inherit;outline:none;resize:vertical}
.mfield input:focus,.mfield select:focus,.mfield textarea:focus{border-color:var(--accent)}
.mrow{display:flex;gap:10px}
.mrow .mfield{flex:1}
.mtoggle{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:11px}
.mtoggle input{width:auto}
.madv summary{font-size:12px;color:var(--muted);cursor:pointer}
.madv .mfields{margin-top:9px}
.mactions{display:flex;gap:10px;margin-top:14px}
.mactions button{flex:1;padding:9px;border-radius:10px;font-size:13px;cursor:pointer;border:1px solid var(--border)}
.mactions .mok{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff}
.mactions .mcancel{background:var(--panel2);color:var(--text)}
.merr{font-size:11.5px;color:var(--err);margin-top:6px;min-height:14px;line-height:1.5}
/* 供应商+模型 选择器 */
#picker{display:flex;gap:8px;max-width:760px;margin:0 auto 9px;align-items:center}
#picker select{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:7px 10px;color:var(--text);font-size:12.5px;outline:none;cursor:pointer}
#picker select:focus{border-color:var(--accent)}
#picker select:disabled{opacity:.5;cursor:not-allowed}
#pvhint{font-size:10.5px;color:var(--accent);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
/* 作品操作按钮 */
.pb{display:inline-block;margin-top:8px;margin-right:6px;font-size:11px;color:var(--accent);text-decoration:none;border:1px solid rgba(108,140,255,.4);padding:3px 11px;border-radius:18px;background:var(--panel2);cursor:pointer}
.pb:hover{border-color:var(--accent)}
.pb.prev{color:var(--text)}
.pb.run{color:var(--warn);border-color:rgba(251,191,36,.4)}
/* 预览模态 */
#pvbody{margin-top:14px;max-height:56vh;overflow-y:auto;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:12px;padding:16px 18px;font-size:14px;line-height:1.9;color:var(--text)}
#pvbody .pv-h{font-weight:700;color:#fff;font-size:16px;margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
#pvbody .pv-h:first-child{margin-top:0}
#pvbody .pv-q{color:var(--muted);border-left:3px solid var(--accent);padding:2px 12px;margin:10px 0;font-size:13.5px}
#pvbody .pv-li{color:var(--text);margin:2px 0;padding-left:6px}
#pvbody .pv-hr{border-top:1px solid var(--border);margin:16px 0}
#pvbody b{color:#fff}
#pvch{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:5px 8px;color:var(--text);font-size:12px;cursor:pointer}
.pvclose{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13px}
/* 供应商组折叠 + 卡片体可折叠 + 模型可点选默认 */
#provsum{margin:2px 14px 8px;padding:9px 13px;border-radius:11px;background:var(--panel);border:1px solid var(--border);cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:8px;user-select:none}
#provsum:hover{background:var(--panel2)}
#provsum .arr{color:var(--accent);font-size:11px;transition:transform .2s}
#provsum.open .arr{transform:rotate(90deg)}
#provsum .sumn{margin-left:auto;font-size:11px;color:var(--muted)}
.vitem .vh{cursor:pointer}
.vitem .vchev{color:var(--muted);font-size:10px;transition:transform .15s}
.vitem.collapsed .vbody{display:none}
.vitem.collapsed .vchev{transform:rotate(-90deg)}
.vitem .vmodels .mtag{cursor:pointer}
.vitem .vmodels .mtag:hover{border-color:var(--accent);color:var(--text)}
.vitem .vmodels .mtag.cur{border-color:var(--accent);color:var(--accent);background:rgba(108,140,255,.16)}
.vmodels-hint{font-size:10px;color:var(--muted);margin-top:5px}
/* ============ v0.2 作品库管理 ============ */
#libtool{padding:2px 14px 8px}
#libq{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:9px;padding:7px 10px;color:var(--text);font-size:12.5px;outline:none;margin-bottom:8px}
#libq:focus{border-color:var(--accent)}
.librow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.librow label{font-size:10.5px;color:var(--muted);flex-shrink:0}
#libsort{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:5px 8px;color:var(--text);font-size:12px;outline:none;flex:1;min-width:0}
#liborder{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:12px}
.libchip{font-size:10.5px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:3px 9px;cursor:pointer;transition:.15s;white-space:nowrap}
.libchip.on{color:var(--text);border-color:var(--accent);background:rgba(108,140,255,.16)}
#libstats{padding:0 14px;margin:0 0 8px;font-size:10.5px;color:var(--muted);line-height:1.7;border-bottom:1px dashed var(--border);padding-bottom:8px}
#libstats b{color:var(--text)}
#libstats .qok{color:var(--ok)}#libstats .qbad{color:var(--err)}
.qbadge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:20px;margin-left:5px;vertical-align:1px;font-weight:600}
.qbadge.pass{background:rgba(74,222,128,.18);color:var(--ok)}
.qbadge.fail{background:rgba(248,113,113,.18);color:var(--err)}
.qbadge.na{background:rgba(139,147,167,.15);color:var(--muted)}
.pitem .fav{cursor:pointer;font-size:13px;float:right;padding:0 2px;opacity:.4}
.pitem .fav.on{opacity:1;color:var(--warn)}
.pitem .gchip{display:inline-block;font-size:10px;color:var(--accent2);background:rgba(160,108,255,.14);border-radius:6px;padding:1px 6px;margin-left:5px}
.pitem .tbar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0}
.pitem .tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.pitem .bchk{width:13px;height:13px;accent-color:var(--accent);cursor:pointer}
#libbatch{display:none;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
#libbatch .pb{margin:0}
/* 重写方向卡片（预览模态内） */
.rwcard{margin-top:14px;background:rgba(74,222,128,.07);border:1px solid rgba(74,222,128,.25);border-radius:12px;padding:13px 15px;font-size:13px}
.rwcard h4{font-size:13px;margin-bottom:8px;color:var(--text)}
.rwcard .rwdir{font-size:12px;color:var(--muted);line-height:1.7;margin:4px 0}
.rwcard .rwsum{font-size:14px;font-weight:700;margin:6px 0}
.rwcard .rwsum .up{color:var(--ok)}.rwcard .rwsum .dn{color:var(--err)}
.rwcard .rwnote{font-size:11px;color:var(--muted);line-height:1.6}
.rwbtn{margin-top:9px;font-size:12px;background:linear-gradient(135deg,var(--ok),#34d399);border:none;color:#04121f;font-weight:600;padding:6px 14px;border-radius:9px;cursor:pointer}
.rwbtn:disabled{opacity:.5;cursor:not-allowed}
.rwchips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.rwchips label{font-size:11px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:3px 8px;cursor:pointer;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <div id="chat">
    <div id="head">
      <div class="logo">🖋</div>
      <div>
        <h1>神笔 · 小说创作机器人</h1>
        <p>「一幕·神笔 · ShenBi NovelCraft」原创创作系统 —— 说个主题，它把整部小说写完（对标网文排行前列）</p>
      </div>
    </div>
    <div id="msgs"></div>
    <div id="inputbar">
      <div id="picker">
        <select id="pselect" title="选择模型供应商"></select>
        <select id="mselect" title="选择大模型"></select>
        <span id="pvhint"></span>
      </div>
      <div id="inputrow">
        <textarea id="inp" placeholder="告诉我要写什么小说… 例如：写一部悬疑小说，退休刑警被诬陷杀人，10章"></textarea>
        <button id="send">➤</button>
      </div>
    </div>
  </div>
  <div id="side">
    <h2>当前作品进度</h2>
    <div id="prog">
      <div class="t" id="pname" style="font-size:14px;font-weight:600"></div>
      <div class="bar"><div class="fill" id="pfill" style="width:0%"></div></div>
      <div class="prow"><span id="pinfo">0/0 章</span><span id="pwords">0 字</span></div>
    </div>
    <div id="evts"></div>
    <h2>作品库</h2>
    <div id="libtool">
      <input id="libq" placeholder="🔍 搜索书名 / 题材…">
      <div class="librow">
        <label>排序</label>
        <select id="libsort">
          <option value="updated">最近更新</option>
          <option value="created">创建时间</option>
          <option value="quality">质量分</option>
          <option value="progress">完成度</option>
          <option value="words">字数</option>
          <option value="chapters">章节数</option>
          <option value="genre">题材</option>
          <option value="status">状态</option>
        </select>
        <button id="liborder" title="升/降序">↓</button>
      </div>
      <div class="librow" id="libstatus"><span class="libchip on" data-st="">全部</span>
        <span class="libchip" data-st="in_progress">创作中</span>
        <span class="libchip" data-st="completed">已出书</span>
        <span class="libchip" data-st="passing">已达标</span>
        <span class="libchip" data-st="unrated">未审稿</span>
        <span class="libchip" data-st="archived" title="回收站">🗑 回收站</span></div>
      <div class="librow" id="libgenre"></div>
    </div>
    <div id="libstats"></div>
    <div id="libbatch">
      <span style="font-size:11px;color:var(--muted);align-self:center" id="libn"></span>
      <button class="pb" data-batch="review">📝 批量审稿</button>
      <button class="pb" data-batch="compare">⇄ 对比(2)</button>
      <button class="pb" data-batch="favorite">★ 收藏</button>
      <button class="pb run" data-batch="delete">🗑 归档</button>
      <button class="pb" data-batch="restore">♻ 恢复</button>
      <button class="pb prev" data-batch="clear">✕</button>
    </div>
    <div id="plist"><div class="empty">暂无作品</div></div>
    <div id="cmpbox" style="padding:0 14px 8px"></div>
    <div class="secrow">
      <h2>模型供应商</h2>
      <button id="addprov">＋ 绑定</button>
    </div>
    <div id="provsum" style="display:none"></div>
    <div id="provlist"><div class="empty">加载中…</div></div>
  </div>
</div>
<!-- 绑定供应商 模态 -->
<div id="provmodal" class="modal">
  <div class="mbox">
    <h3>绑定模型供应商</h3>
    <div class="mhint">支持 OpenAI 兼容 <code>/chat/completions</code> 接口。选预设一键绑定，或填 base_url + key 完全自定义。可同时绑定多个并存，创作时按需选择。</div>
    <div class="mfield">
      <label>预设供应商</label>
      <select id="mpreset"></select>
    </div>
    <div class="mfield">
      <label>名称</label>
      <input id="mname" placeholder="例如：我的 Agnes">
    </div>
    <div class="mfield">
      <label>Base URL（root，不含 /chat/completions）</label>
      <input id="murl" placeholder="https://…/v1 或 http://127.0.0.1:11434/v1">
    </div>
    <div class="mrow">
      <div class="mfield"><label>API Key（可选）</label><input id="mkey" placeholder="Bearer 密钥"></div>
      <div class="mfield"><label>或 Key 文件路径</label><input id="mkeyfile" placeholder="/path/to/key"></div>
    </div>
    <div class="mfield">
      <label>模型清单（逗号分隔；绑定时可点「拉取」自动获取）</label>
      <textarea id="mmodels" rows="2" placeholder="model-a, model-b"></textarea>
    </div>
    <details class="madv">
      <summary>高级（温度 / 上限 / 超时）</summary>
      <div class="mfields">
        <div class="mrow">
          <div class="mfield"><label>temperature</label><input id="mtemp" type="number" step="0.05" value="0.85"></div>
          <div class="mfield"><label>max_tokens</label><input id="mtoken" type="number" step="100" value="12000"></div>
          <div class="mfield"><label>超时(秒)</label><input id="mtimeout" type="number" step="30" value="900"></div>
        </div>
      </div>
    </details>
    <label class="mtoggle"><input type="checkbox" id="mactive" checked> 立即设为可用（active）</label>
    <div class="merr" id="merr"></div>
    <div class="mactions">
      <button class="mcancel" onclick="closeProvModal()">取消</button>
      <button class="mok" id="mbind">绑定</button>
    </div>
  </div>
</div>
<!-- 作品预览 模态 -->
<div id="pvmodal" class="modal">
  <div class="mbox" style="width:700px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <h3 id="pvtitle" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></h3>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="pvch"></select>
        <button id="pvval" class="pb prev" onclick="runValidate()" title="对全书跑 确定性引擎 + 五角色审校 + 百分制达标判定">📝 审稿</button>
        <button id="pvrw" class="pb run" onclick="runRewritePlan()" title="未达标时按审查结论+重写方向定向重写">🔁 重写</button>
        <a id="pvdow" class="pb prev" href="#" target="_blank">⬇ 下载</a>
        <button class="pvclose" onclick="closePvModal()">✕ 关闭</button>
      </div>
    </div>
    <div id="pvbody">加载中…</div>
    <div id="rwbox"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const sid=(localStorage.nbot_sid||(localStorage.nbot_sid=crypto.randomUUID()));
let curKey=null, timer=null, polling=false;
const msgBox=$('msgs');

function bubble(who,html,cls){
  const d=document.createElement('div');
  d.className='msg '+who+(cls?' '+cls:'');
  d.innerHTML=`<div class="ava">${who==='bot'?'🖋':'🙂'}</div><div class="bubble">${html}</div>`;
  msgBox.appendChild(d); msgBox.scrollTop=msgBox.scrollHeight;
  return d;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(s){
  return esc(s)
    .replace(/(【\d+】|✅|⚠️|📐|📚|✍️|🔁|💥)/g,'<b>$1</b>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/(^|\n)(📖|🧑|💥|🌍|👁|🎨|💡|📚|📊|✅|⚠️)([^\n]*)/g,'$1<b>$2</b><span style="color:var(--text)">$3</span>');
}
function thinking(){
  const d=document.createElement('div');
  d.className='msg bot'; d.id='think';
  d.innerHTML='<div class="ava">🖋</div><div class="bubble thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span> 构思中…</div>';
  msgBox.appendChild(d); msgBox.scrollTop=msgBox.scrollHeight;
}
function killThinking(){const t=$('think'); if(t)t.remove();}

async function send(){
  const v=$('inp').value.trim(); if(!v)return;
  $('inp').value='';
  bubble('user',fmt(v));
  thinking();
  const pid=$('pselect')?$('pselect').value:'', mid=$('mselect')?$('mselect').value:'';
  const payload={session_id:sid,message:v};
  if(pid)payload.provider_id=pid;
  if(mid)payload.model=mid;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)});
    const j=await r.json();
    killThinking();
    bubble('bot',fmt(j.reply||'(空回复)'));
    if(j.project){curKey=j.project; startPolling();}
    refreshProjects();
  }catch(e){killThinking();bubble('bot','⚠️ 服务异常：'+e);}
}
$('send').onclick=send;
$('inp').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});

function startPolling(){
  if(polling)return; polling=true;
  timer=setInterval(async()=>{
    if(!curKey)return;
    try{
      const j=await (await fetch('/api/status?key='+encodeURIComponent(curKey))).json();
      if(j.error)return;
      $('prog').style.display='block';
      $('pname').textContent='《'+(j.name||curKey)+'》';
      const pct=j.total?Math.round(j.done/j.total*100):0;
      $('pfill').style.width=pct+'%';
      $('pinfo').textContent=j.done+'/'+j.total+' 章 · '+(j.state==='completed'?'✅ 完成':j.state==='in_progress'?'✍️ 创作中':j.state==='validating'?'🔁 校验中':j.state);
      $('pwords').textContent=j.words+' 字';
      $('evts').innerHTML=(j.events||[]).slice(-8).map(e=>'<div>'+esc(e)+'</div>').join('');
      if(j.state==='completed'){refreshProjects();}
    }catch(e){}
  },4000);
}

function refreshProjects(){ loadLibrary(); }

// ===== 作品库管理（v0.2）=====
const L={sort:'updated',order:'desc',genre:'',status:'',q:'',sel:new Set()};
function libQuery(){
  const p=new URLSearchParams();
  p.set('sort',L.sort); p.set('order',L.order);
  if(L.genre)p.set('genre',L.genre);
  if(L.status)p.set('status',L.status);
  if(L.q)p.set('q',L.q);
  return p.toString();
}
async function loadLibrary(){
  let d; try{ d=await (await fetch('/api/library?'+libQuery())).json(); }catch(e){return;}
  if(!d.items)return;
  const s=d.stats;
  $('libstats').innerHTML = (L.status==='archived'?'🗑 回收站 · '+s.count+' 本':
    '共 <b>'+s.count+'</b> 本 · 达标 <span class="qok">'+s.passing+'</span> / 未评 '+s.unrated+
    ' · 均分 <b>'+(s.avg_quality==null?'—':s.avg_quality)+'</b> · 总字数 <b>'+(s.total_words||0)+'</b>');
  const gs=(d.facets&&d.facets.genres)||[];
  $('libgenre').innerHTML='<label>题材</label>'+gs.map(g=>
    '<span class="libchip'+(L.genre===g?' on':'')+'" data-g="'+esc(g)+'">'+esc(g)+'</span>').join('');
  $('libgenre').querySelectorAll('[data-g]').forEach(c=>c.onclick=()=>{L.genre=(L.genre===c.dataset.g?'':c.dataset.g);L.status='';syncChips();loadLibrary();});
  const el=$('plist');
  if(!d.items.length){el.innerHTML='<div class="empty">'+(L.status==='archived'?'回收站为空':'暂无作品')+'</div>';}
  else el.innerHTML=d.items.map(i=>{
    const qb=i.quality==null?'<span class="qbadge na">未审</span>':(i.passing?'<span class="qbadge pass">'+i.quality+'</span>':'<span class="qbadge fail">'+i.quality+'</span>');
    const tag=i.state==='completed'?'<span class="tag done">完成</span>'
      :(i.running?'<span class="tag run">创作中</span>':'<span class="tag wait">'+esc(i.status_label||i.state)+'</span>');
    const sel=L.sel.has(i.key);
    let act='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">';
    if(L.status==='archived'){ act+='<button class="pb" data-key="'+i.key+'" data-op="restore">♻ 恢复</button>'; }
    else{
      act+='<button class="pb prev" data-key="'+i.key+'" data-op="prev">👁 预览</button>';
      if(i.state==='completed'){ act+='<a class="pb" href="/api/download?key='+encodeURIComponent(i.key)+'" target="_blank" onclick="event.stopPropagation()">⬇ 成书</a><button class="pb run" data-key="'+i.key+'" data-op="cx">▶ 续写</button>'; }
      else if(i.running){ act+='<button class="pb" disabled style="opacity:.5">创作中…</button>'; }
      else{ act+='<button class="pb" data-key="'+i.key+'" data-op="cont">▶ 继续写</button>'; }
    }
    act+='</div>';
    return '<div class="pitem" data-key="'+i.key+'" onclick="pick(\''+i.key+'\')">'+
      '<span class="fav'+(i.favorite?' on':'')+'" data-key="'+i.key+'" onclick="toggleFav(event,this)" title="收藏">'+(i.favorite?'★':'☆')+'</span>'+
      '<input type="checkbox" class="bchk" style="float:right" data-key="'+i.key+'" '+(sel?'checked':'')+' onclick="toggleSel(event,this)"> '+
      '<div class="t">'+esc(i.name)+tag+'<span class="gchip">'+esc(i.genre)+'</span>'+qb+'</div>'+
      '<div class="tbar"><i style="width:'+i.progress+'%"></i></div>'+
      '<div class="s"><span>'+i.done+'/'+i.total+' 章 · '+i.total_words+' 字</span></div>'+act+'</div>';
  }).join('');
  syncBatch();
  el.querySelectorAll('[data-op]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const k=b.dataset.key,op=b.dataset.op;
    if(op==='prev')openPreview(k);
    else if(op==='cx')contExtra(k);
    else if(op==='cont')cont(k);
    else if(op==='restore')batchOp([k],'restore');
  });
}
function toggleSel(e,chk){e.stopPropagation(); if(chk.checked)L.sel.add(chk.dataset.key);else L.sel.delete(chk.dataset.key); syncBatch();}
function syncBatch(){ const n=L.sel.size; $('libbatch').style.display=n?'flex':'none'; $('libn').textContent='已选 '+n+' 本：'; }
function toggleFav(e,el){e.stopPropagation();
  fetch('/api/library/'+encodeURIComponent(el.dataset.key)+'/favorite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on:!el.classList.contains('on')})}).then(()=>loadLibrary());
}
function batchOp(keys,action){
  fetch('/api/library/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keys,action})})
   .then(r=>r.json()).then(j=>{ L.sel.clear(); loadLibrary(); });
}
function batchReview(keys){ keys.forEach(k=>fetch('/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k,mode:'report'})})); L.sel.clear(); loadLibrary(); bubble('bot','📝 已对选中的 '+keys.length+' 本作后台审稿…'); }
function showCompare(a,b){
  fetch('/api/compare?keys='+encodeURIComponent(a)+','+encodeURIComponent(b)).then(r=>r.json()).then(d=>{
    if(!d.items||d.items.length<2)return;
    const row=i=>'<div style="flex:1;min-width:130px"><b>'+esc(i.name)+'</b><br>'+
      '<span class="qbadge '+(i.quality==null?'na':i.passing?'pass':'fail')+'">'+(i.quality==null?'未审':i.quality)+'</span> '+esc(i.genre)+
      '<br>'+i.done+'/'+i.total+' 章 · '+i.total_words+' 字 · '+(i.status_label||'')+'</div>';
    $('cmpbox').innerHTML='<div style="border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--panel);display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:8px">'+
      row(d.items[0])+'<div style="font-size:16px;color:var(--accent)">⇄</div>'+row(d.items[1])+
      '<button class="libchip" onclick="$(\'cmpbox\').innerHTML=\'\'">✕ 关闭</button></div>';
  });
}
function syncChips(){ $('libstatus').querySelectorAll('.libchip').forEach(c=>c.classList.toggle('on',c.dataset.st===(L.status||''))); }

// ===== 审查后重写 =====
let RWBRIEF=null, _rwT=0;
async function runRewritePlan(){
  if(!PV_KEY)return;
  $('rwbox').innerHTML='<div class="rwcard"><h4>🔁 生成重写方向</h4><div class="rwnote">正在分析 13/14/L1 与最低维度（约 30-90 秒）…</div></div>';
  let b; try{ b=await (await fetch('/api/rewrite-plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:PV_KEY})})).json(); }catch(e){$('rwbox').innerHTML='';return;}
  if(!b||b.before_total==null){$('rwbox').innerHTML='';return;}
  RWBRIEF=b;
  const chaps=(b.chapters||[]).map(c=>c.chapter);
  $('rwbox').innerHTML='<div class="rwcard"><h4>🔁 审查后重写 · 当前 '+b.before_total+' / 达标线 '+b.pass_line+'（'+(b.pass?'✅ 已达标':'未达标，建议重写')+'）</h4>'+
    '<div class="rwdir"><b>主攻方向：</b>'+(b.global_directions||[]).map(g=>esc((g.split('：')[0]))).join(' / ')+'</div>'+
    '<div class="rwdir"><b>逐章待修：</b>'+(chaps.length?'第 '+chaps.join('、')+' 章':'（无定位到章的高严重度项）')+'</div>'+
    (chaps.length?'<div class="rwchips">'+chaps.map(c=>'<label><input type="checkbox" class="rwchk" value="'+c+'" checked> 第'+c+'章</label>').join('')+'</div>':'')+
    '<button class="rwbtn" id="rwgo">开始定向重写（逐条带入要求）</button></div>';
  $('rwgo').onclick=()=>{ const sel=[...document.querySelectorAll('.rwchk')].filter(c=>c.checked).map(c=>+c.value); doRewrite(sel.length?sel:null); };
}
function doRewrite(chapters){
  const g=$('rwgo'); if(g){g.disabled=true;g.textContent='重写中…';}
  _rwT=Date.now();
  fetch('/api/rewrite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:PV_KEY,chapters})})
   .then(r=>r.json()).then(()=>pollRewrite());
}
function pollRewrite(){
  const t=setInterval(async()=>{
    try{
      const d=await (await fetch('/api/rewrite-log?key='+encodeURIComponent(PV_KEY))).json();
      if(!d.running){
        clearInterval(t);
        if(d.result&&d.result.error){ $('rwbox').innerHTML='<div class="rwcard"><h4>⚠️ 重写失败</h4><div class="rwnote">'+esc(d.result.error)+'</div></div>'; }
        else if(d.result){ showRewriteResult(d.result); loadLibrary(); }
        else { $('rwbox').innerHTML='<div class="rwcard"><div class="rwnote">重写完成（无返回结果，见 16-重写记录）。<button class="rwbtn" onclick="showPv(\'quality\')">查看质量报告</button></div></div>'; }
        const g=$('rwgo'); if(g){g.disabled=false;g.textContent='开始定向重写';}
      }
      else if(Date.now()-_rwT>360000){ clearInterval(t); $('rwbox').innerHTML+='<div class="rwnote">重写进行中（>6 分钟，仍在后台跑，可稍后查看 16-重写记录）</div>'; }
    }catch(e){}
  },6000);
}
function showRewriteResult(res){
  const delta=res.after-res.before, up=delta>=0;
  $('rwbox').innerHTML='<div class="rwcard"><h4>🔁 重写完成</h4>'+
    '<div class="rwsum">百分制 '+res.before+' → '+res.after+'（<span class="'+(up?'up':'dn')+'">'+(up?'+':'')+delta+'</span>）· '+(res.pass?'✅ 已达标':'未达标')+' · 改写 '+res.changed.length+' 章</div>'+
    '<div class="rwdir"><b>仍弱维度：</b>'+(res.weak_after||[]).join(' / ')||'（无明显短板）'+'</div>'+
    '<div class="rwnote">各章注入的要求 + 前后字数见 <b>16-重写记录.md</b>（作品目录内）。分数为 LLM 五角色重评，可能有波动。</div>'+
    '<div style="margin-top:8px;display:flex;gap:8px"><button class="rwbtn" onclick="showPv(\'quality\')">查看新质量报告</button></div></div>';
}
window.pick=k=>{curKey=k;startPolling();refreshProjects();};
window.cont=k=>{
  fetch('/api/continue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k})})
    .then(r=>r.json()).then(j=>{bubble('bot',fmt(j.msg||'继续中…'));curKey=k;startPolling();refreshProjects();});
};
window.contExtra=k=>{
  const r=prompt('续写：在现有章节之后继续写几章？','3'); if(r===null)return;
  const extra=Math.max(0,parseInt(r)||0); if(!extra)return;
  fetch('/api/continue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k,extra:extra})})
    .then(x=>x.json()).then(j=>{bubble('bot',fmt(j.msg||'续写中…'));curKey=k;startPolling();refreshProjects();});
};
// ============ 模型供应商（多供应商绑定 / 创作选模型） ============
let provOpts=[], provPresets=[], provOpen={}, provGroupOpen=null;
const $p=id=>document.getElementById(id);

async function loadProviderPicker(){
  try{
    const j=await (await fetch('/api/model_options')).json();
    provOpts=j.options||[];
    const ps=$p('pselect'), ms=$p('mselect');
    if(!provOpts.length){ps.disabled=ms.disabled=true; ms.innerHTML=''; $p('pvhint').textContent='无可用供应商'; return;}
    ps.disabled=ms.disabled=false;
    ps.innerHTML=provOpts.map(o=>'<option value="'+o.id+'">'+esc(o.name)+'</option>').join('');
    const saved=localStorage.getItem('nbot_prov')||'';
    let defId=(saved&&provOpts.find(x=>x.id===saved))?saved:(j.default_provider||provOpts[0].id);
    ps.value=defId;
    fillModelSel(ps.value);
    ps.onchange=()=>{fillModelSel(ps.value); localStorage.setItem('nbot_prov',ps.value); updateHint();};
    ms.onchange=()=>{localStorage.setItem('nbot_prov',ps.value); updateHint();};
    updateHint();
  }catch(e){}
}
function fillModelSel(pid){
  const o=provOpts.find(x=>x.id===pid), ms=$p('mselect');
  const models=(o&&o.models&&o.models.length)?o.models:[];
  ms.disabled=!models.length;
  ms.innerHTML=models.map(m=>'<option value="'+esc(m)+'">'+esc(m)+'</option>').join('');
  if(o&&o.default_model&&models.includes(o.default_model))ms.value=o.default_model;
  else if(ms.value&&!models.includes(ms.value))ms.value=models[0]||'';
}
function updateHint(){
  const pid=$p('pselect').value, m=$p('mselect').value, o=provOpts.find(x=>x.id===pid);
  $p('pvhint').textContent=(pid&&m)?('当前：'+(o?o.name:pid)+' · '+m):(pid?'当前：'+(o?o.name:pid)+'（默认模型）':'默认供应商');
}

async function loadProviders(){
  try{
    const j=await (await fetch('/api/providers')).json();
    provPresets=j.presets||[];
    const list=j.providers||[], defId=j.default_provider, el=$p('provlist'), sum=$p('provsum');
    if(!list.length){
      sum.style.display='none';
      el.style.display='block';
      el.innerHTML='<div class="empty">尚未绑定供应商<br><button class="vbtn" style="margin-top:8px" onclick="openProvModal()">＋ 绑定一个</button></div>';
      return;
    }
    // 组级折叠：多个自动收起（重叠），单个自动展开；用户可点击切换
    if(provGroupOpen===null) provGroupOpen=(list.length>1)?false:true;
    const defName=(list.find(x=>x.id===defId)||{}).name||'（无）';
    sum.style.display='flex';
    sum.innerHTML='<span class="arr">▶</span><span class="vdot"></span><b>模型供应商</b><span class="sumn">'+list.length+' 个 · 默认 '+esc(defName)+'</span>';
    sum.classList.toggle('open', provGroupOpen);
    sum.onclick=toggleProvGroup;
    el.style.display=provGroupOpen?'block':'none';
    el.innerHTML=list.map(p=>{
      const isDef=p.id===defId, curm=p.default_model;
      const bodyOpen=(provOpen[p.id]!==undefined)?provOpen[p.id]:(!isDef); // 默认供应商收起，其它展开
      const mlist=(p.models&&p.models.length)
        ? '<div class="vmodels">'+p.models.map(m=>'<span class="mtag'+(m===curm?' cur':'')+'" data-m="'+esc(m)+'" data-pid="'+p.id+'" title="点我设为该供应商默认">'+esc(m)+(m===curm?' ✓':'')+'</span>').join('')+'</div>'+
          '<div class="vmodels-hint">点任一模型 → 设为该供应商的默认模型</div>'
        : '<div class="vmodels">（无模型清单 · 点「拉取模型」或绑定表单填写）</div>';
      return '<div class="vitem'+(p.active?'':' off')+(bodyOpen?'':' collapsed')+'" data-id="'+p.id+'">'+
        '<div class="vh" data-toggle="'+p.id+'"><span class="vchev">▾</span><span class="vdot"></span>'+
        '<span class="vname">'+esc(p.name)+(isDef?' <span class="vdef">★ 默认</span>':'')+'</span>'+
        '<span class="vstat">'+(p.active?'可用':'停用')+'</span></div>'+
        '<div class="vbody">'+
          '<div class="vrow">'+
            '<button class="vbtn" data-act="toggle" data-id="'+p.id+'">'+(p.active?'停用':'启用')+'</button>'+
            '<button class="vbtn def" data-act="def" data-id="'+p.id+'"'+(isDef?' disabled':'')+'>'+(isDef?'默认':'设默认')+'</button>'+
            '<button class="vbtn" data-act="test" data-id="'+p.id+'">测试</button>'+
            '<button class="vbtn" data-act="fetch" data-id="'+p.id+'">拉取模型</button>'+
            '<button class="vbtn danger" data-act="del" data-id="'+p.id+'">删除</button>'+
          '</div>'+
          mlist+
          '<div class="vkey">key：'+esc(p.key_display||'未设置')+'</div>'+
          '<div class="vstat vtest" style="margin-top:5px"></div>'+
        '</div>'+
      '</div>';
    }).join('');
    el.querySelectorAll('[data-toggle]').forEach(h=>h.onclick=e=>{e.stopPropagation();toggleVitem(h.dataset.toggle);});
    el.querySelectorAll('.mtag[data-m]').forEach(t=>t.onclick=e=>{e.stopPropagation();setProvDefaultModel(t.dataset.pid,t.dataset.m);});
    el.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>provAction(b.dataset.act,b.dataset.id,b));
  }catch(e){}
}
function toggleProvGroup(){ provGroupOpen=!provGroupOpen; const s=$p('provsum'); s.classList.toggle('open',provGroupOpen); $p('provlist').style.display=provGroupOpen?'block':'none'; }
function toggleVitem(pid){ const el=document.querySelector('.vitem[data-id="'+pid+'"]'); if(!el)return; const c=el.classList.toggle('collapsed'); provOpen[pid]=!c; }
async function setProvDefaultModel(pid, model){
  const r=await fetch('/api/providers/'+encodeURIComponent(pid),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({default_model:model})});
  const j=await r.json(); if(j.error){bubble('bot','⚠️ 设置默认模型失败：'+j.error);return;}
  await loadProviders(); await loadProviderPicker();
  bubble('bot','✅ 「'+(j.provider.name)+'」的默认模型已设为 <b>'+esc(model)+'</b>。');
}
async function provAction(act, pid, btn){
  try{
    if(act==='del'){
      if(!confirm('删除供应商「'+pid+'」？（其数据与模型清单将一并移除）'))return;
      const j=await (await fetch('/api/providers/'+encodeURIComponent(pid),{method:'DELETE'})).json();
      if(j.error)throw new Error(j.error);
    }else if(act==='def'){
      await fetch('/api/providers/'+encodeURIComponent(pid)+'/default',{method:'POST'});
    }else if(act==='toggle'){
      const wantActive=btn.textContent.trim()==='启用';
      await fetch('/api/providers/'+encodeURIComponent(pid)+'/active',{method:'POST',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({active:wantActive})});
    }else if(act==='test'){
      if(btn){btn.classList.add('busy');btn.textContent='测试中…';}
      const j=await (await fetch('/api/providers/'+encodeURIComponent(pid)+'/test',{method:'POST',
        headers:{'Content-Type':'application/json'},body:'{}'})).json();
      const box=document.querySelector('.vitem[data-id="'+pid+'"] .vtest');
      if(box)box.textContent=(j.ok?'✅ ':'⚠️ ')+(j.detail||'');
      if(btn){btn.classList.remove('busy');btn.textContent='测试';}
      if(j.models&&j.models.length)return loadProviders();
      return;
    }else if(act==='fetch'){
      if(btn){btn.classList.add('busy');btn.textContent='拉取中…';}
      const j=await (await fetch('/api/providers/'+encodeURIComponent(pid)+'/models',{method:'POST'})).json();
      const box=document.querySelector('.vitem[data-id="'+pid+'"] .vtest');
      if(box)box.textContent=j.from_api?('✅ 已拉取 '+j.models.length+' 个模型'):('⚠️ '+(j.msg||'拉取失败'));
      if(btn){btn.classList.remove('busy');btn.textContent='拉取模型';}
    }
    await loadProviders(); await loadProviderPicker();
  }catch(e){bubble('bot','⚠️ 供应商操作失败：'+e);}
}

function openProvModal(){
  $p('merr').textContent='';
  const ps=$p('mpreset');
  ps.innerHTML='<option value="">自定义</option>'+provPresets.map(p=>'<option value="'+p.slug+'">'+esc(p.name)+'</option>').join('');
  ps.onchange=presetChg();
  $p('mname').value='';$p('murl').value='';$p('mkey').value='';$p('mkeyfile').value='';$p('mmodels').value='';
  $p('mtemp').value='0.85';$p('mtoken').value='12000';$p('mtimeout').value='900';$p('mactive').checked=true;
  $p('provmodal').classList.add('show');
}
function presetChg(){
  return function(){
    const s=$p('mpreset').value, p=provPresets.find(x=>x.slug===s); $p('merr').textContent='';
    if(p){$p('mname').value=p.name;$p('murl').value=p.base_url;$p('mkeyfile').value='';
      $p('mmodels').value=(p.models||[]).join(', ');}
  };
}
function closeProvModal(){$p('provmodal').classList.remove('show');}
async function bindProv(){
  $p('merr').textContent='';
  const preset=$p('mpreset').value;
  const payload={name:$p('mname').value.trim(), base_url:$p('murl').value.trim(),
    api_key:$p('mkey').value.trim(), api_key_file:$p('mkeyfile').value.trim(),
    models:$p('mmodels').value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean),
    temperature:parseFloat($p('mtemp').value)||0.85,
    max_tokens:parseInt($p('mtoken').value)||12000,
    timeout:parseInt($p('mtimeout').value)||900,
    active:$p('mactive').checked};
  if(preset)payload.preset=preset;
  if(!payload.base_url&&!preset){$p('merr').textContent='请选择预设或填写 Base URL';return;}
  if(!preset&&!payload.models.length){$p('merr').textContent='请填写至少一个模型（逗号分隔），或选预设自动填充';return;}
  const j=await (await fetch('/api/providers',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})).json();
  if(j.error){$p('merr').textContent=j.error;return;}
  closeProvModal();
  await loadProviders(); await loadProviderPicker();
  bubble('bot','✅ 已绑定供应商「'+(j.provider.name)+'」（'+(j.provider.models.length||0)+' 个模型）。创作时可在输入框上方选择供应商与模型。');
}
window.openProvModal=openProvModal;
window.closeProvModal=closeProvModal;

// ============ 作品预览（点开即看内容） ============
let PV_KEY=null, PV_TEXT='';
function mdLite(s){
  let t=esc(s||'');
  t=t.replace(/^#{1,6}\s+(.+)$/gm,(m,x)=>'<div class="pv-h">'+x+'</div>');
  t=t.replace(/^>\s?(.+)$/gm,(m,x)=>'<div class="pv-q">'+x+'</div>');
  t=t.replace(/^[ \t]*[-*]\s+(.+)$/gm,(m,x)=>'<div class="pv-li">• '+x+'</div>');
  t=t.replace(/^[ \t]*[-=]{3,}[ \t]*$/gm,'<div class="pv-hr"></div>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  t=t.replace(/\n{3,}/g,'\n\n').replace(/\n/g,'<br>');
  t=t.replace(/<\/div><br>/g,'</div>').replace(/<br><div/g,'<div').replace(/<br><br>/g,'<br><br>');
  return t;
}
async function openPreview(key){
  PV_KEY=key; PV_TEXT='';
  $('pvmodal').classList.add('show');
  $('pvtitle').textContent='加载中…'; $('pvbody').textContent='加载中…'; $('pvch').innerHTML='';
  const j=await (await fetch('/api/preview?key='+encodeURIComponent(key))).json();
  if(j.error){$('pvbody').textContent='⚠️ '+j.error;return;}
  PV_TEXT=j.text||'';
  const done=(j.chapters||[]).filter(c=>c.status==='completed').length;
  $('pvtitle').textContent='《'+(j.name||key)+'》 '+(j.has_book?'· 成书':'· 已写 '+done+' 章')
    +(j.total_words?(' · 约 '+j.total_words+' 字'):'');
  $('pvdow').href='/api/download?key='+encodeURIComponent(key);
  const haveCh=(j.chapters||[]).filter(c=>(c.words||0)>0||c.status==='completed');
  const sel=$('pvch');
  sel.innerHTML='<option value="all">'+(j.has_book?'全文（成书）':'全部已写')+'</option>'+
    haveCh.map(c=>'<option value="'+c.n+'">第'+c.n+'章'+(c.continuation?'（续写）':(c.title&&c.title!=='续写'?' '+esc(c.title):''))+'</option>').join('')
    +(j.has_book?'<option value="quality">📊 质量报告（五角色+达标判定）</option><option value="review">📋 修订记录（五角色审校）</option>':'');
  sel.onchange=()=>showPv(sel.value);
  showPv('all');
}
async function showPv(sel){
  const body=$('pvbody');
  if(sel==='all'){ body.innerHTML=mdLite(PV_TEXT)||'<span style="color:var(--muted)">（暂无内容）</span>'; }
  else if(sel==='quality'){
    const j=await (await fetch('/api/quality?key='+encodeURIComponent(PV_KEY))).json();
    body.innerHTML=(j&&j.text)?mdLite(j.text):'<span style="color:var(--muted)">尚未质检。点右上「📝 审稿」跑 确定性引擎+五角色 并出百分制达标判定。</span>';
  }
  else if(sel==='review'){
    const j=await (await fetch('/api/review?key='+encodeURIComponent(PV_KEY))).json();
    body.innerHTML=(j&&j.text)?mdLite(j.text):'<span style="color:var(--muted)">尚未审稿。点右上「📝 审稿」跑一次五角色分层编辑。</span>';
  }
  else{
    const j=await (await fetch('/api/chapter?key='+encodeURIComponent(PV_KEY)+'&n='+sel)).json();
    body.innerHTML=mdLite(j.text||'（该章尚未生成）');
  }
  body.scrollTop=0;
}
async function runValidate(){
  if(!PV_KEY) return;
  const b=$('pvval'); b.disabled=true; b.textContent='⏳ 审稿中';
  $('pvbody').textContent='📝 正在跑 确定性引擎 + 五角色审校 + 百分制（对标达标线 90），约 30-90 秒…';
  await fetch('/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:PV_KEY,mode:'report'})});
  const t0=Date.now();
  const poll=async()=>{
    try{
      const s=await (await fetch('/api/status?key='+encodeURIComponent(PV_KEY))).json();
      if(s.state==='completed'||s.state==='failed'||s.state==='idle'){
        await showPv('quality'); $('pvch').value='quality'; b.disabled=false; b.textContent='📝 审稿'; return;
      }
      if(Date.now()-t0<180000) setTimeout(poll,4000);
      else {b.disabled=false;b.textContent='📝 审稿';}
    }catch(e){b.disabled=false;b.textContent='📝 审稿';}
  };
  setTimeout(poll,3000);
}
window.openPreview=openPreview;
window.closePvModal=()=>$('pvmodal').classList.remove('show');
window.runValidate=runValidate;

  ord.onclick=()=>{ L.order=L.order==='desc'?'asc':'desc'; ord.textContent=L.order==='desc'?'↓':'↑'; loadLibrary(); };
  let qT=null; $('libq').oninput=e=>{ L.q=e.target.value; clearTimeout(qT); qT=setTimeout(loadLibrary,250); };
  $('libstatus').querySelectorAll('.libchip').forEach(c=>c.onclick=()=>{ L.status=c.dataset.st; L.genre=''; syncChips(); loadLibrary(); });
  $('libbatch').querySelectorAll('[data-batch]').forEach(b=>b.onclick=()=>{
    const act=b.dataset.batch, keys=[...L.sel];
    if(act==='clear'){ L.sel.clear(); loadLibrary(); }
    else if(act==='review'){ batchReview(keys); }
    else if(act==='compare'){ if(keys.length>=2) showCompare(keys[0], keys[1]); }
    else { batchOp(keys, act); }
  });
})();
