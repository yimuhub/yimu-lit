# 桌面版自动构建：推 tag（v*）时产出 Mac DMG + Windows 安装包并挂到 GitHub Release。
# 手动触发（workflow_dispatch）只上传构建产物到 Actions 工件页。
name: desktop-build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller pywebview
      - run: pyinstaller desktop/yimulit_mac.spec --noconfirm --distpath desktop/dist --workpath desktop/build
      - name: Verify native window (pywebview)
        run: |
          SMOKE=$(mktemp -d)
          YIMU_DATA_DIR="$SMOKE" YIMU_PORT=46990 ./desktop/dist/YiMuLit.app/Contents/MacOS/YiMuLit &
          APP_PID=$!
          sleep 15
          if grep -q "原生窗口不可用" "$SMOKE/logs/launcher.log" 2>/dev/null; then
            echo "::error::pywebview 原生窗口失败——检查 pyobjc 采集"; exit 1
          fi
          curl -s -o /dev/null "http://127.0.0.1:46990/" || exit 1
          kill $APP_PID
      - name: Make DMG
        run: |
          STAGE=$(mktemp -d)
          # v4.32.3：用户实拍 DMG 里应用显示成英文「YiMuLit」。构建产物仍用 ASCII
          # 名字（PyInstaller/上传工件对中文路径有过吞字），但在装进 DMG 时改名为
          # 中文「一幕神笔.app」，卷名也一并中文化；Finder / Dock / 菜单栏都以此为准。
          cp -R "desktop/dist/YiMuLit.app" "$STAGE/一幕神笔.app"
          cp README-DESKTOP.txt "$STAGE/首次启动说明.txt"
          ln -s /Applications "$STAGE/Applications"
          VER=$(cat VERSION)
          hdiutil create -volname "一幕神笔" -srcfolder "$STAGE" -ov -format UDZO "desktop/dist/YiMuLit-$VER-mac.dmg"
          # 打包红线：应用显示名必须是中文，任何一个环节退回英文就直接让 CI 失败
          test -d "$STAGE/一幕神笔.app/Contents"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$STAGE/一幕神笔.app/Contents/Info.plist")" = "一幕神笔"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$STAGE/一幕神笔.app/Contents/Info.plist")" = "一幕神笔"
      - uses: actions/upload-artifact@v4
        with: { name: mac-dmg, path: desktop/dist/*.dmg }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: desktop/dist/*.dmg }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller pywebview
      - run: pyinstaller desktop/yimulit_win.spec --noconfirm --distpath desktop/dist --workpath desktop/build
      - name: Smoke test
        shell: pwsh
        run: |
          $env:YIMU_DATA_DIR = "$env:TEMP\yimulit_smoke"
          $env:YIMU_PORT = "46921"
          $p = Start-Process -FilePath "desktop/dist/YiMuLit/YiMuLit.exe" -PassThru
          Start-Sleep -Seconds 15
          $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:46921/" -TimeoutSec 10
          if ($r.StatusCode -ne 200) { throw "smoke failed" }
          Stop-Process -Id $p.Id -Force
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Inject version into installer.iss
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          $p = 'desktop/windows/installer.iss'
          $c = Get-Content $p -Raw -Encoding UTF8
          $c = $c -replace '#define AppVersion "0\.0\.0"', "#define AppVersion `"$ver`""
          [System.IO.File]::WriteAllText($p, $c, (New-Object System.Text.UTF8Encoding $true))
      - name: Build installer (Inno Setup)
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" desktop\windows\installer.iss'
      - uses: actions/upload-artifact@v4
        with: { name: windows-setup, path: desktop/dist/*.exe }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: desktop/dist/*.exe }
