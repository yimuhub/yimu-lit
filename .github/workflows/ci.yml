name: CI

# 手动触发。**刻意不挂 push。**
#
# 为什么不挂 push：
#   ① 迭代期每次提交都跑，lint 一挂就直接 skip 掉测试，20 秒给一个红叉，
#      既没有有效信号又打断提交节奏——本仓库历史 104 次运行、最近十次全红，
#      原因就是 ruff 先挂、测试根本没跑起来。
#   ② 提交规范是「改完就推」，一天可能推十几次，排队反而不如本地跑。
#
# 关于费用（免得每次都要重新确认）：
#   本仓库是公开仓库（yimuhub/yimu-lit），标准 runner（ubuntu-latest）的
#   Actions 分钟数**免费且不限量**，手动触发也不花钱；改回 push 触发同样不花钱，
#   只是噪音大。真正会计费的是 larger runners 和私有仓库的额度。
#
# 本地体检等价于下面三步，秒级、不排队：
#   bash tools/static_check.sh
#   ruff check app.py bot tests run.py tools build.py
#   python -m pytest -q && python tools/check_frontend_js.py
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app.py bot tests run.py tools build.py
      - name: Backend tests (LLM mocked)
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend inline JS syntax
        run: python tools/check_frontend_js.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install audit tool
        run: pip install pip-audit
      # 依赖 CVE 不阻断合并（先可见、再升级）；有高危请及时处理
      - name: pip-audit
        continue-on-error: true
        run: pip-audit -r requirements.txt
