name: CI

# push / PR 自动跑，也可手动触发。
#
# 历史：v4.21 ~ v4.23.1 期间这里**只留 workflow_dispatch**，原因是当时 ruff
# 有 44 条告警、8 个测试红，每次 push 都先挂 lint、pytest 直接 skip，20 秒
# 给一个红叉——既没有有效信号，又把「最近十次全红」变成了常态。
#
# v4.23.2 把 ruff 归零、8 个红测试全部转绿、接线与样式体检接成可守门脚本，
# 前提已满足，于是把 push 触发装回来：现在红叉代表真回归，而不是历史欠账。
#
# 关于费用（免得每次都要重新确认）：
#   本仓库是公开仓库（yimuhub/yimu-lit），标准 runner（ubuntu-latest）的
#   Actions 分钟数**免费且不限量**。真正会计费的是 larger runners 和私有仓库。
#
# 本地等价于下面四步，秒级、不排队：
#   bash tools/static_check.sh
#   ruff check app.py bot tests run.py tools build.py
#   bash tools/test.sh
#   python tools/check_frontend_js.py && python tools/audit_css.py --strict
#   python tools/audit_wiring.py --strict
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "交付截图/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 同一分支连续推多次时，取消上一轮未完成的运行，避免排队浪费
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25          # 防止任何一步无声挂死（此前 npm 卡了 27 分钟还没停）
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app.py bot tests run.py tools build.py
      - name: Backend tests (LLM mocked)
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Frontend inline JS syntax
        run: python tools/check_frontend_js.py
      # v4.24.12：jsdom 真渲染回归——「创作状态按钮刷新后消失」和「极速入口看不见」
      # 这两类问题用字符串断言查不出来（元素压根没进 DOM），必须真跑一遍渲染。
      #
      # 2026-11-09（v4.33.4 之后补）：这一步连续两轮卡在 npm install 上 20+ 分钟。
      # 根因是 package-lock.json 里 37 个包的 resolved 全指向镜像
      # registry.npmmirror.com（国内装机快），GitHub 的 Azure runner 拉这个源极慢。
      # 因此 CI 侧强制走 npmjs 官方源，并用 --no-package-lock 忽略 lock 里的镜像地址：
      # 只有 jsdom 一个依赖，重新解析代价很小；本地开发仍用 mirror（lock 不动）。
      # 再加 8 分钟硬超时，网络抖动就直接红，而不是把 job 挂到天荒地老。
      - name: Frontend jsdom render tests
        timeout-minutes: 8
        env:
          npm_config_registry: https://registry.npmjs.org
        run: |
          npm install --no-package-lock --no-audit --no-fund --fetch-timeout=45000 --fetch-retries=2
          npm test
      # 接线体检要 import app 并问 node 要 api.js 的真实 key，所以放在 node
      # 之后；没有 node 时会退回正则，结论会偏宽松，不能当门禁用。
      - name: Wiring audit (api keys ↔ routes)
        run: python tools/audit_wiring.py --strict
      - name: CSS audit (JS classes ↔ stylesheet)
        run: python tools/audit_css.py --strict

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install audit tool
        run: pip install pip-audit
      # 依赖 CVE 不阻断合并（先可见、再升级）；有高危请及时处理
      - name: pip-audit
        continue-on-error: true
        run: pip-audit -r requirements.txt
